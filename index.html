<body>
<canvas id="c" width="480" height="640"></canvas>
<script>
const cv=document.getElementById('c'),g=cv.getContext('2d'),W=480,H=640;
const SKINS=[
{n:'Синий',a:'#a9b6ff',b:'#4f6bff',u:0},{n:'Огонёк',a:'#ffd27a',b:'#ff5a1f',u:30},{n:'Слайм',a:'#c8ffb0',b:'#2fbf5b',u:60},
{n:'Космонавт',a:'#ffffff',b:'#9aa4c4',u:100},{n:'Кошка',a:'#ffc2e6',b:'#e84393',u:150},{n:'Король',a:'#fff3b0',b:'#e0a800',u:250},
{n:'Призрак',a:'#ffffff',b:'#aab4e8',u:320},{n:'Робот',a:'#d7dde8',b:'#6b7a99',u:400},{n:'Пират',a:'#ffb0a0',b:'#b3261e',u:500},
{n:'Ниндзя',a:'#555b73',b:'#161828',u:650},{n:'Пришелец',a:'#d6ff9e',b:'#5fd32f',u:800},{n:'Панда',a:'#ffffff',b:'#cfd3dc',u:1000},
{n:'Тыква',a:'#ffc46b',b:'#e8650a',u:1300},{n:'Дракон',a:'#ff9a8a',b:'#c9312b',u:1600}];
const THEMES=[
{n:'Космос',t:'#0b0d1f',b:'#232866',u:0,mu:{r:57,s:[0,2,3,5,7,8,10],p:[0,5,2,6],w:'triangle',bw:'triangle',b:104}},
{n:'Закат',t:'#2b1055',b:'#ff6a3d',u:40,mu:{r:60,s:[0,2,4,5,7,9,11],p:[0,4,5,3],w:'sine',bw:'triangle',b:100}},
{n:'Неон',t:'#050014',b:'#0a3d62',u:120,mu:{r:52,s:[0,2,3,5,7,8,10],p:[0,0,5,6],w:'sawtooth',bw:'sawtooth',b:112}},
{n:'Лес',t:'#06231a',b:'#1f6f4a',u:200,mu:{r:55,s:[0,2,3,5,7,9,10],p:[0,3,0,4],w:'triangle',bw:'sine',b:96}},
{n:'Лава',t:'#1a0505',b:'#7a1d0a',u:300,mu:{r:50,s:[0,1,3,5,7,8,10],p:[0,1,0,6],w:'square',bw:'sawtooth',b:116}},
{n:'Океан',t:'#02172e',b:'#0b5d8f',u:450,mu:{r:53,s:[0,2,4,6,7,9,11],p:[0,1,4,0],w:'sine',bw:'sine',b:92}},
{n:'Матрица',t:'#000a03',b:'#003d14',u:700,mu:{r:48,s:[0,2,3,5,7,8,11],p:[0,3,4,0],w:'square',bw:'square',b:120}},
{n:'Арктика',t:'#0c2540',b:'#7fb7d9',u:900,mu:{r:59,s:[0,2,4,5,7,9,11],p:[0,5,3,4],w:'sine',bw:'triangle',b:98}}];
const BGC=['rgba(255,255,255,.6)','rgba(255,255,255,.6)','rgba(255,255,255,.6)','rgba(200,255,150,.75)','rgba(255,170,70,.8)','rgba(180,230,255,.5)','rgba(80,255,120,.4)','rgba(255,255,255,.85)'];
const NEW={2:'зигзаги',3:'шипы',4:'стены',5:'охотники',6:'лазеры'};
let hi=0,sk=0,th=0,muted=false,musOn=true,newRec=false,dieAt=0,unl=[],btns=[],flash=0,banner=null;
try{hi=+localStorage.getItem('hi')||0;sk=+localStorage.getItem('sk')||0;th=+localStorage.getItem('th')||0;musOn=localStorage.getItem('mus')!=='0'}catch(e){}
sk=Math.min(sk,SKINS.length-1);th=Math.min(th,THEMES.length-1);
let st='menu',P,items,parts,score,lives,combo,t=0,fr=0,shake,inv,pw,lastLv,keys={},tx=null,dif=0,nextWall,nextLaser;
const EM={heart:'❤️',shield:'🛡️',magnet:'🧲',slow:'🐌'};
const bg=Array.from({length:70},()=>({x:Math.random()*W,y:Math.random()*H,s:Math.random()*2+.5,v:Math.random()*.8+.2}));
const rain=Array.from({length:24},(_,i)=>({x:i*20+10,y:Math.random()*H,v:2+Math.random()*3}));

/* ================= ЗВУК ================= */
let ac,mst,sfxB,musB,lp,nbuf,mtimer=null,nextT=0,mstep=0,slowOn=false;
const mf=m=>440*Math.pow(2,(m-69)/12);
function initA(){
 if(ac){if(ac.state==='suspended')ac.resume();return}
 try{
  ac=new(window.AudioContext||window.webkitAudioContext)();
  const comp=ac.createDynamicsCompressor();mst=ac.createGain();mst.gain.value=muted?0:1;mst.connect(comp);comp.connect(ac.destination);
  sfxB=ac.createGain();sfxB.gain.value=.9;sfxB.connect(mst);
  lp=ac.createBiquadFilter();lp.type='lowpass';lp.frequency.value=18000;
  musB=ac.createGain();musB.gain.value=musOn?.5:0;musB.connect(lp);lp.connect(mst);
  const dl=ac.createDelay(1),fb=ac.createGain(),wet=ac.createGain(),snd=ac.createGain();
  dl.delayTime.value=.28;fb.gain.value=.32;wet.gain.value=.28;snd.gain.value=.35;
  sfxB.connect(snd);musB.connect(snd);snd.connect(dl);dl.connect(fb);fb.connect(dl);dl.connect(wet);wet.connect(mst);
  nbuf=ac.createBuffer(1,ac.sampleRate*2,ac.sampleRate);const d=nbuf.getChannelData(0);for(let i=0;i<d.length;i++)d[i]=Math.random()*2-1;
 }catch(e){ac=null}
}
function wake(){initA();if(ac&&!mtimer&&(st==='menu'||st==='play'))startMusic()}
function tn(f,d,o={}){
 if(!ac||muted)return;
 const t0=o.T??ac.currentTime+(o.at||0),os=ac.createOscillator(),n=ac.createGain();
 os.type=o.w||'sine';os.frequency.setValueAtTime(f,t0);
 if(o.to)os.frequency.exponentialRampToValueAtTime(o.to,t0+d);
 if(o.det)os.detune.value=o.det;
 if(o.vib){const l=ac.createOscillator(),lg=ac.createGain();l.frequency.value=o.vib;lg.gain.value=f*.04;l.connect(lg);lg.connect(os.frequency);l.start(t0);l.stop(t0+d+.05)}
 const v=o.v??.2,a=o.a??.004;
 n.gain.setValueAtTime(.0001,t0);n.gain.exponentialRampToValueAtTime(v,t0+a);n.gain.exponentialRampToValueAtTime(.0001,t0+d);
 os.connect(n);n.connect(o.bus||sfxB);os.start(t0);os.stop(t0+d+.05);
}
function nz(d,o={}){
 if(!ac||muted)return;
 const t0=o.T??ac.currentTime+(o.at||0),s=ac.createBufferSource(),f=ac.createBiquadFilter(),n=ac.createGain();
 s.buffer=nbuf;f.type=o.ft||'bandpass';f.frequency.setValueAtTime(o.f||2000,t0);
 if(o.to)f.frequency.exponentialRampToValueAtTime(o.to,t0+d);f.Q.value=o.q||1;
 n.gain.setValueAtTime(.0001,t0);n.gain.exponentialRampToValueAtTime(o.v??.2,t0+(o.a??.005));n.gain.exponentialRampToValueAtTime(.0001,t0+d);
 s.connect(f);f.connect(n);n.connect(o.bus||sfxB);s.start(t0,Math.random()*.4);s.stop(t0+d+.05);
}
const PEN=[0,2,4,7,9];
const S={
 star(c){const k=Math.min(c,19),f=mf(72+PEN[k%5]+12*((k/5)|0));tn(f,.2,{w:'triangle',v:.22});tn(f*2,.14,{v:.09,at:.015});tn(f*3,.08,{v:.04,at:.03});nz(.05,{f:8000,ft:'highpass',v:.03})},
 mult(){[0,4,7,12].forEach((x,i)=>tn(mf(76+x),.16,{w:'square',v:.07,at:i*.05}))},
 gem(){[0,4,7,12,16].forEach((x,i)=>{tn(mf(79+x),.22,{w:'triangle',v:.17,at:i*.045});tn(mf(91+x),.12,{v:.05,at:i*.045})})},
 heart(){[0,4,7,12].forEach((x,i)=>tn(mf(60+x),.5,{v:.2,at:i*.07,to:mf(60+x)*1.02}));tn(mf(84),.4,{v:.08,at:.25})},
 shield(){tn(220,.45,{w:'sawtooth',to:1100,v:.08});nz(.4,{f:400,to:5000,q:3,v:.1});tn(1320,.3,{v:.1,at:.3});tn(1760,.3,{v:.07,at:.34})},
 magnet(){tn(180,.5,{w:'sawtooth',to:360,v:.07,vib:18});tn(182,.5,{w:'square',to:364,v:.04});[0,1,2].forEach(i=>tn(900+i*200,.1,{v:.06,at:.3+i*.06}))},
 slow(){tn(900,.7,{to:90,v:.2});nz(.7,{ft:'lowpass',f:4000,to:150,v:.18});tn(300,.6,{w:'triangle',to:60,v:.12})},
 tick(){tn(1200,.05,{w:'square',v:.05})},
 end(){[0,1,2].forEach(i=>tn(660-i*110,.12,{w:'triangle',v:.1,at:i*.08}))},
 hit(){tn(160,.45,{w:'sawtooth',to:35,v:.38});tn(95,.4,{w:'square',to:30,v:.22});nz(.4,{ft:'lowpass',f:2500,to:150,v:.4});tn(220,.3,{w:'sawtooth',to:150,v:.1,det:600})},
 brk(){nz(.35,{ft:'highpass',f:3000,v:.25});tn(1800,.25,{w:'square',to:260,v:.1});tn(2400,.18,{to:500,v:.08,at:.03});tn(180,.2,{w:'triangle',to:70,v:.2})},
 near(){nz(.22,{f:600,to:3500,q:2,v:.12});tn(1200,.08,{v:.05,at:.12,to:1800})},
 lose(){tn(300,.25,{w:'triangle',to:150,v:.1})},
 warn(){for(let i=0;i<4;i++)tn(i%2?330:440,.12,{w:'square',v:.08,at:i*.14})},
 charge(){tn(150,.95,{w:'sawtooth',to:1000,v:.08});tn(155,.95,{w:'square',to:1010,v:.04});nz(.9,{f:500,to:6000,q:4,v:.06})},
 fire(){nz(.45,{f:5000,to:300,q:.7,v:.4});tn(1400,.4,{w:'sawtooth',to:90,v:.2});tn(90,.4,{w:'square',v:.2,to:50})},
 beat(){tn(70,.14,{v:.5,to:45});tn(70,.14,{v:.4,to:45,at:.17})},
 level(){[0,4,7,12,16].forEach((x,i)=>{tn(mf(60+x),.3,{w:'square',v:.08,at:i*.07});tn(mf(72+x),.3,{w:'triangle',v:.1,at:i*.07})});nz(.6,{f:300,to:6000,q:2,v:.12})},
 click(){tn(800,.05,{w:'square',v:.06});tn(1200,.04,{v:.05,at:.03})},
 skin(){tn(600,.08,{w:'triangle',v:.1});tn(900,.1,{w:'triangle',v:.08,at:.05})},
 pause(){tn(500,.12,{w:'triangle',v:.12});tn(380,.14,{w:'triangle',v:.1,at:.08})},
 over(){[69,66,62,57].forEach((m,i)=>tn(mf(m),.5,{w:'triangle',v:.18,at:i*.28,to:mf(m)*.97}));tn(110,1.6,{w:'sawtooth',to:40,v:.15,at:.1});nz(1,{ft:'lowpass',f:1200,to:80,v:.2})},
 record(){[0,4,7,12,7,12,16,19].forEach((x,i)=>{tn(mf(64+x),.35,{w:'square',v:.07,at:i*.1});tn(mf(76+x),.35,{v:.1,at:i*.1})});nz(.8,{ft:'highpass',f:6000,v:.1,at:.7})},
 unlock(){[0,2,4,7,9,12].forEach((x,i)=>tn(mf(79+x),.22,{w:'triangle',v:.14,at:i*.06}))}
};
const bpm=()=>(THEMES[th].mu.b+Math.min(70,dif*6))*(pw&&pw.slow>0?.75:1);
const hs=n=>{const x=Math.sin(n*127.1+311.7)*43758.5453;return x-Math.floor(x)};
function playStep(i,T){
 if(!musOn||muted)return;
 const M=THEMES[th].mu,L=st==='menu'?0:1+Math.floor(dif),bar=(i/16)|0,s=i%16,ch=M.p[bar%M.p.length],sd=60/bpm()/4,B={T,bus:musB};
 const N=d=>M.r+M.s[d%7]+12*((d/7)|0);
 if(s===0)[0,2,4].forEach(k=>tn(mf(N(ch+k)+12),sd*15,{...B,w:'sine',v:.06,a:.25}));
 if(s===0||s===8||(L>=2&&s%4===0)||(L>=4&&s%2===0))tn(mf(N(ch)-12+(s%8===6?12:0)),sd*1.7,{...B,w:M.bw,v:.2});
 if(L>=1){
  if(s%8===0||(L>=2&&s%4===0)){tn(150,.16,{...B,to:42,v:.55});nz(.02,{...B,ft:'lowpass',f:3000,v:.1})}
  if(s%4===2)nz(.04,{...B,ft:'highpass',f:7500,v:.07});
  if(L>=3&&(s===4||s===12)){nz(.14,{...B,ft:'highpass',f:1800,v:.22});tn(200,.1,{...B,w:'triangle',to:120,v:.15})}
  if(L>=7&&s%2===1)nz(.03,{...B,ft:'highpass',f:9000,v:.05});
 }
 if(L===0?s%4===0:(L>=2&&(L>=3||s%2===0))){
  const ai=L>=3?s:L>=2?s>>1:s>>2;
  tn(mf(N(ch+[0,2,4,7,4,2,4,2][ai%8])+12),sd*1.3,{...B,w:M.w,v:L===0?.04:.06});
 }
 if(L>=5&&s%2===0&&hs(bar*16+s)>.5)tn(mf(N(ch+[0,2,4,7,9][hs(bar*3+s)*5|0]+7)+12),sd*2.2,{...B,w:M.w,v:.07,vib:5});
}
function startMusic(){
 if(!ac||mtimer)return;
 const n=ac.currentTime;musB.gain.cancelScheduledValues(n);musB.gain.setValueAtTime(musB.gain.value,n);musB.gain.linearRampToValueAtTime(musOn?.5:0,n+.3);
 nextT=n+.08;mstep=0;
 mtimer=setInterval(()=>{
  if(!ac)return;
  if(nextT<ac.currentTime-.3)nextT=ac.currentTime+.05;
  while(nextT<ac.currentTime+.15){playStep(mstep++,nextT);nextT+=60/bpm()/4}
 },30);
}
function stopMusic(fade){
 clearInterval(mtimer);mtimer=null;
 if(ac&&fade){const n=ac.currentTime;musB.gain.cancelScheduledValues(n);musB.gain.setValueAtTime(musB.gain.value,n);musB.gain.linearRampToValueAtTime(0,n+.6)}
}
function toggleMute(){muted=!muted;if(mst)mst.gain.value=muted?0:1}
function toggleMus(){musOn=!musOn;try{localStorage.setItem('mus',musOn?1:0)}catch(e){}if(ac){const n=ac.currentTime;musB.gain.cancelScheduledValues(n);musB.gain.setValueAtTime(musOn?.5:0,n)}}

/* ================= ИГРА ================= */
function reset(){P={x:W/2,y:H-80,r:16};items=[];parts=[];score=0;lives=3;combo=0;t=0;shake=0;inv=0;lastLv=1;dif=0;flash=0;banner=null;nextWall=900;nextLaser=1500;pw={shield:0,magnet:0,slow:0}}
reset();
const lv=()=>1+Math.floor(dif);
const mult=()=>Math.min(5,1+Math.floor(combo/5));
function burst(x,y,c,n=14){for(let i=0;i<n;i++)parts.push({x,y,vx:(Math.random()-.5)*7,vy:(Math.random()-.5)*7,l:30+Math.random()*20,m:50,c,r:2+Math.random()*3})}
function float(x,y,txt,c){parts.push({x,y,vx:0,vy:-1,l:45,m:45,c,txt})}
const rx=()=>30+Math.random()*(W-60);
function hit(o){
 const k=o.k;
 if(k==='star'){const m0=mult();combo++;const m=mult();score+=m;float(o.x,o.y,'+'+m,'#ffd23f');burst(o.x,o.y,'#ffd23f',8);S.star(combo);if(m>m0)S.mult()}
 else if(k==='gem'){const m=mult();score+=5*m;float(o.x,o.y,'+'+5*m,'#5ad1ff');burst(o.x,o.y,'#5ad1ff',16);S.gem()}
 else if(k==='heart'){lives=Math.min(5,lives+1);float(o.x,o.y,'+❤️','#ff6b8b');S.heart()}
 else if(k==='shield'){pw.shield=900;float(o.x,o.y,'Щит!','#5ad1ff');S.shield()}
 else if(k==='magnet'){pw.magnet=480;float(o.x,o.y,'Магнит!','#c28bff');S.magnet()}
 else if(k==='slow'){pw.slow=360;float(o.x,o.y,'Замедление!','#7dff9b');S.slow()}
 else{
  if(inv>0)return;
  if(pw.shield>0){pw.shield=0;inv=45;burst(P.x,P.y,'#5ad1ff',20);S.brk()}
  else{lives--;combo=0;inv=90;shake=18;burst(P.x,P.y,'#ff5a5f',24);S.hit();if(lives<=0)over()}
 }
}
function over(){
 st='over';dieAt=performance.now();newRec=score>hi;unl=[];const o=hi;
 if(newRec){hi=score;try{localStorage.setItem('hi',hi)}catch(e){}}
 for(const x of SKINS.concat(THEMES))if(x.u>o&&x.u<=hi)unl.push(x.n);
 stopMusic(1);S.over();
 if(newRec)setTimeout(()=>{if(st==='over')S.record()},1500);
 if(unl.length)setTimeout(()=>{if(st==='over')S.unlock()},newRec?3000:1500);
}
function step(){
 t++;dif=Math.min(60,score/22+t/1500);
 let ax=0;if(keys.arrowleft||keys.a)ax--;if(keys.arrowright||keys.d)ax++;
 P.x+=ax*Math.min(11,7+dif*.15);if(tx!==null)P.x+=(tx-P.x)*.3;
 P.x=Math.max(P.r,Math.min(W-P.r,P.x));
 for(const k in pw)if(pw[k]>0){pw[k]--;if(!pw[k])S.end();else if(pw[k]===60||pw[k]===30)S.tick()}
 if(inv>0)inv--;if(shake>0)shake--;if(flash>0)flash-=.03;if(banner&&--banner.l<=0)banner=null;
 const L=lv(),sl=pw.slow>0?.55:1;
 if((pw.slow>0)!==slowOn){slowOn=pw.slow>0;if(ac)lp.frequency.setTargetAtTime(slowOn?650:18000,ac.currentTime,.1)}
 if(lives===1&&t%56===0)S.beat();
 if(L>lastLv){lastLv=L;banner={a:'Уровень '+L,b:NEW[L]?'Новое: '+NEW[L]+'!':'Ещё быстрее!',l:110};flash=1;S.level()}
 const base=Math.min(9.5,2.2+dif*.24),gap=Math.max(10,Math.round(40-dif*2.2));
 if(t%gap===0){
  const r=Math.random(),x0=rx(),v=base+Math.random()*1.2;
  if(L<2||r<.45)items.push({k:'block',x:x0,x0,y:-30,v,s:17});
  else if(L<3||r<.7)items.push({k:'zig',x:x0,x0,y:-30,v:v*.8,s:15,ph:Math.random()*6});
  else if(L<5||r<.88)items.push({k:'spike',x:x0,x0,y:-30,v:v*1.5,s:14});
  else items.push({k:'seek',x:x0,y:-30,v:v*.7,s:15});
 }
 if(L>=4&&t>=nextWall){
  nextWall=t+Math.max(380,900-dif*30|0);
  const gw=Math.max(100,160-dif*3),gx=30+Math.random()*(W-60-gw);
  S.warn();float(W/2,100,'⚠ СТЕНА','#ff9f1c');
  for(let x=17;x<W;x+=34)if(x<gx||x>gx+gw)items.push({k:'block',x,x0:x,y:-30,v:base*.85,s:15,wall:1});
 }
 if(L>=6&&t>=nextLaser){
  nextLaser=t+Math.max(300,800-dif*25|0);S.charge();float(W/2,100,'⚠ ЛАЗЕР','#ff5a7a');
  for(let i=0;i<(L>=10?2:1);i++)items.push({k:'laser',x:Math.max(30,Math.min(W-30,P.x+(Math.random()-.5)*(i?300:120))),y:0,c:0,ch:Math.max(45,75-dif*2)|0,v:0,s:0});
 }
 if(t%30===0)items.push({k:Math.random()<.1?'gem':'star',x:rx(),y:-20,v:2.6+Math.random(),s:14});
 if(t%700===0){const ks=lives<5?['heart','shield','magnet','slow']:['shield','magnet','slow'];items.push({k:ks[Math.random()*ks.length|0],x:rx(),y:-20,v:2.2,s:16})}
 for(const o of items){
  if(o.k==='laser'){
   o.c++;if(o.c===o.ch)S.fire();
   if(o.c>=o.ch&&o.c<o.ch+24&&Math.abs(P.x-o.x)<18+P.r*.6){hit(o);if(st!=='play')break}
   if(o.c>o.ch+24)o.dead=1;continue;
  }
  const y0=o.y;o.y+=o.v*sl;
  if(o.k==='zig')o.x=o.x0+Math.sin(t*.06+o.ph)*55;
  if(o.k==='seek'){const dx=P.x-o.x;o.x+=Math.sign(dx)*Math.min(Math.abs(dx),.9+dif*.05)*sl}
  if(pw.magnet>0&&(o.k==='star'||o.k==='gem')){const dx=P.x-o.x,dy=P.y-o.y,d=Math.hypot(dx,dy);if(d<200&&d>1){o.x+=dx/d*5;o.y+=dy/d*5}}
  if(Math.hypot(o.x-P.x,o.y-P.y)<P.r+o.s*.8){o.dead=1;hit(o);if(st!=='play')break}
  else{
   if(!o.wall&&!o.nm&&'block zig spike seek'.includes(o.k)&&y0<P.y&&o.y>=P.y&&Math.abs(o.x-P.x)<P.r+o.s+28){o.nm=1;score++;float(P.x,P.y-30,'близко! +1','#fff');S.near()}
   if(o.y>H+30){o.dead=1;if(o.k==='star'){if(combo>=5)S.lose();combo=0}}
  }
 }

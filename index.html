<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Звёздный бегун</title>
<style>
:root{--bg:#0b0d1f;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
html,body{height:100%;margin:0;background:var(--bg)}
body{display:flex;align-items:center;justify-content:center;user-select:none;-webkit-user-select:none;overflow:hidden}
canvas{height:min(98vh,130vw);aspect-ratio:3/4;max-width:100vw;touch-action:none;border-radius:12px;box-shadow:0 0 40px rgba(90,110,255,.25)}
</style>
</head>
<body>
<canvas id="c" width="480" height="640"></canvas>
<script>
const cv=document.getElementById('c'),g=cv.getContext('2d'),W=480,H=640;
let hi=0,muted=false,newRec=false,dieAt=0;
try{hi=+localStorage.getItem('hi')||0}catch(e){}
let st='menu',P,items,parts,score,lives,combo,t=0,shake,inv,pw,lastLv,keys={},tx=null;
const EM={heart:'❤️',shield:'🛡️',magnet:'🧲',slow:'🐌'};
const bg=Array.from({length:70},()=>({x:Math.random()*W,y:Math.random()*H,s:Math.random()*2+.5,v:Math.random()*.8+.2}));
let ac;
function snd(f,d=.1,type='sine',v=.07){if(muted)return;try{ac=ac||new(window.AudioContext||window.webkitAudioContext)();const o=ac.createOscillator(),n=ac.createGain();o.type=type;o.frequency.value=f;n.gain.setValueAtTime(v,ac.currentTime);n.gain.exponentialRampToValueAtTime(.0001,ac.currentTime+d);o.connect(n);n.connect(ac.destination);o.start();o.stop(ac.currentTime+d)}catch(e){}}
function reset(){P={x:W/2,y:H-80,r:16};items=[];parts=[];score=0;lives=3;combo=0;t=0;shake=0;inv=0;lastLv=1;pw={shield:0,magnet:0,slow:0}}
reset();
const lv=()=>1+Math.floor(score/25);
const mult=()=>Math.min(5,1+Math.floor(combo/5));
function burst(x,y,c,n=14){for(let i=0;i<n;i++)parts.push({x,y,vx:(Math.random()-.5)*7,vy:(Math.random()-.5)*7,l:30+Math.random()*20,m:50,c,r:2+Math.random()*3})}
function float(x,y,txt,c){parts.push({x,y,vx:0,vy:-1,l:45,m:45,c,txt})}
function rx(){return 30+Math.random()*(W-60)}
function hit(o){
 const k=o.k;
 if(k==='star'){combo++;const m=mult();score+=m;float(o.x,o.y,'+'+m,'#ffd23f');burst(o.x,o.y,'#ffd23f',8);snd(500+Math.min(combo,20)*25,.1)}
 else if(k==='gem'){const m=mult();score+=5*m;float(o.x,o.y,'+'+5*m,'#5ad1ff');burst(o.x,o.y,'#5ad1ff',16);snd(900,.2,'triangle')}
 else if(k==='heart'){lives=Math.min(5,lives+1);float(o.x,o.y,'+❤️','#ff6b8b');snd(700,.25,'triangle')}
 else if(k==='shield'){pw.shield=900;float(o.x,o.y,'Щит!','#5ad1ff');snd(600,.25,'triangle')}
 else if(k==='magnet'){pw.magnet=480;float(o.x,o.y,'Магнит!','#c28bff');snd(600,.25,'triangle')}
 else if(k==='slow'){pw.slow=360;float(o.x,o.y,'Замедление!','#7dff9b');snd(400,.3,'triangle')}
 else{
  if(inv>0)return;
  if(pw.shield>0){pw.shield=0;inv=45;burst(P.x,P.y,'#5ad1ff',20);snd(300,.2,'square')}
  else{lives--;combo=0;inv=90;shake=18;burst(P.x,P.y,'#ff5a5f',24);snd(140,.35,'sawtooth');if(lives<=0)over()}
 }
}
function over(){st='over';dieAt=performance.now();newRec=score>hi;if(newRec){hi=score;try{localStorage.setItem('hi',hi)}catch(e){}}}
function step(){
 t++;
 let ax=0;if(keys.arrowleft||keys.a)ax--;if(keys.arrowright||keys.d)ax++;
 P.x+=ax*7;if(tx!==null)P.x+=(tx-P.x)*.3;
 P.x=Math.max(P.r,Math.min(W-P.r,P.x));
 for(const k in pw)if(pw[k]>0)pw[k]--;
 if(inv>0)inv--;if(shake>0)shake--;
 const L=lv(),sl=pw.slow>0?.55:1;
 if(L>lastLv){lastLv=L;float(W/2,H/2,'Уровень '+L,'#fff');snd(660,.3,'triangle')}
 if(t%Math.max(14,42-L*3)===0){
  const r=Math.random(),x0=rx(),v=2.4+L*.35+Math.random()*1.5;
  if(r<.55||L<2)items.push({k:'block',x:x0,x0,y:-30,v,s:17});
  else if(r<.85||L<3)items.push({k:'zig',x:x0,x0,y:-30,v:v*.8,s:15,ph:Math.random()*6});
  else items.push({k:'spike',x:x0,x0,y:-30,v:v*1.6,s:14});
 }
 if(t%34===0)items.push({k:Math.random()<.1?'gem':'star',x:rx(),y:-20,v:2.6+Math.random(),s:14});
 if(t%700===0){const ks=lives<5?['heart','shield','magnet','slow']:['shield','magnet','slow'];items.push({k:ks[Math.random()*ks.length|0],x:rx(),y:-20,v:2.2,s:16})}
 for(const o of items){
  o.y+=o.v*sl;
  if(o.k==='zig')o.x=o.x0+Math.sin(t*.06+o.ph)*55;
  if(pw.magnet>0&&(o.k==='star'||o.k==='gem')){const dx=P.x-o.x,dy=P.y-o.y,d=Math.hypot(dx,dy);if(d<200&&d>1){o.x+=dx/d*5;o.y+=dy/d*5}}
  if(Math.hypot(o.x-P.x,o.y-P.y)<P.r+o.s*.8){o.dead=1;hit(o);if(st!=='play')break}
  else if(o.y>H+30){o.dead=1;if(o.k==='star')combo=0}
 }
 items=items.filter(o=>!o.dead);
 if(t%3===0)parts.push({x:P.x+(Math.random()-.5)*8,y:P.y+P.r,vx:0,vy:2,l:14,m:14,c:SKINS[sk].b,r:3});
}
function bgStep(){const s=pw.slow>0?.55:1;for(const b of bg){b.y+=b.v*s*(1+lv()*.1);if(b.y>H){b.y=0;b.x=Math.random()*W}}
 for(const p of parts){p.x+=p.vx;p.y+=p.vy;p.l--}parts=parts.filter(p=>p.l>0)}
function starPath(r){g.beginPath();for(let i=0;i<10;i++){const a=-Math.PI/2+i*Math.PI/5,d=i%2?r*.45:r;g.lineTo(Math.cos(a)*d,Math.sin(a)*d)}g.closePath();g.fill()}
function drawItem(o){
 g.save();g.translate(o.x,o.y);const s=o.s;
 if(o.k==='block'){g.rotate(Math.sin(t*.05+o.x)*.3);g.fillStyle='#e5484d';g.fillRect(-s,-s,s*2,s*2);g.fillStyle='#ff8a8e';g.fillRect(-s+4,-s+4,s*2-8,6)}
 else if(o.k==='zig'){g.rotate(t*.1);g.fillStyle='#ff9f1c';g.beginPath();g.moveTo(0,-s);g.lineTo(s,0);g.lineTo(0,s);g.lineTo(-s,0);g.fill()}
 else if(o.k==='spike'){g.fillStyle='#ff4d9d';g.beginPath();g.moveTo(-s,-s);g.lineTo(s,-s);g.lineTo(0,s*1.4);g.fill()}
 else if(o.k==='star'){g.shadowBlur=14;g.shadowColor='#ffd23f';g.fillStyle='#ffd23f';g.rotate(t*.04);starPath(s*1.2)}
 else if(o.k==='gem'){g.shadowBlur=14;g.shadowColor='#5ad1ff';g.fillStyle='#5ad1ff';g.rotate(t*.04);g.beginPath();g.moveTo(0,-s);g.lineTo(s*.8,0);g.lineTo(0,s);g.lineTo(-s*.8,0);g.fill()}
 else{g.fillStyle='rgba(255,255,255,.18)';g.beginPath();g.arc(0,0,s+4,0,7);g.fill();g.font='22px serif';g.textAlign='center';g.textBaseline='middle';g.fillText(EM[o.k],0,2)}
 g.restore();
}
function T(s,x,y,sz,c,al='center'){g.font='bold '+sz+'px system-ui,sans-serif';g.textAlign=al;g.textBaseline='alphabetic';g.fillStyle=c;g.fillText(s,x,y)}
function draw(){
 const gr=g.createLinearGradient(0,0,0,H);gr.addColorStop(0,'#0b0d1f');gr.addColorStop(1,'#232866');g.fillStyle=gr;g.fillRect(0,0,W,H);
 g.fillStyle='rgba(255,255,255,.6)';for(const b of bg)g.fillRect(b.x,b.y,b.s,b.s);
 g.save();if(shake>0)g.translate((Math.random()-.5)*shake,(Math.random()-.5)*shake);
 for(const o of items)drawItem(o);
 if(st!=='menu'&&!(inv>0&&(t>>2)%2)){
  const q=g.createRadialGradient(P.x-5,P.y-5,2,P.x,P.y,P.r);q.addColorStop(0,'#a9b6ff');q.addColorStop(1,'#4f6bff');
  g.fillStyle=q;g.shadowBlur=16;g.shadowColor='#4f6bff';g.beginPath();g.arc(P.x,P.y,P.r,0,7);g.fill();g.shadowBlur=0;
  g.fillStyle='#fff';g.beginPath();g.arc(P.x-6,P.y-3,4.5,0,7);g.arc(P.x+6,P.y-3,4.5,0,7);g.fill();
  g.fillStyle='#14163a';g.beginPath();g.arc(P.x-6,P.y-3,2,0,7);g.arc(P.x+6,P.y-3,2,0,7);g.fill();
 }
 if(st!=='menu'&&pw.shield>0){g.strokeStyle='rgba(90,209,255,.85)';g.lineWidth=3;g.beginPath();g.arc(P.x,P.y,P.r+8,0,7);g.stroke()}
 if(st!=='menu'&&pw.magnet>0){g.strokeStyle='rgba(194,139,255,.5)';g.lineWidth=2;g.setLineDash([6,6]);g.beginPath();g.arc(P.x,P.y,P.r+20+Math.sin(t*.2)*3,0,7);g.stroke();g.setLineDash([])}
 for(const p of parts){g.globalAlpha=Math.max(0,p.l/p.m);if(p.txt)T(p.txt,p.x,p.y,22,p.c);else{g.fillStyle=p.c;g.beginPath();g.arc(p.x,p.y,p.r,0,7);g.fill()}}
 g.globalAlpha=1;g.restore();
 if(st!=='menu'){
  T('⭐ '+score,14,32,24,'#fff','left');
  T('❤️'.repeat(lives)+'🖤'.repeat(5-lives),14,58,16,'#fff','left');
  if(mult()>1)T('Комбо ×'+mult(),14,84,16,'#ffd23f','left');
  T('Уровень '+lv(),W/2,32,18,'#cfd6ff');T('🏆 '+hi,W/2,54,14,'#8f98d8');
  let y=H-14;for(const [k,mx,c] of [['shield',900,'#5ad1ff'],['magnet',480,'#c28bff'],['slow',360,'#7dff9b']])if(pw[k]>0){g.fillStyle='rgba(255,255,255,.15)';g.fillRect(14,y,80,6);g.fillStyle=c;g.fillRect(14,y,80*pw[k]/mx,6);y-=12}
 }
 T(muted?'🔇':'🔊',W-26,32,22,'#fff');
 if(st==='menu'||st==='over'||st==='pause'){
  g.fillStyle='rgba(8,10,30,.7)';g.fillRect(0,0,W,H);
  if(st==='menu'){T('Звёздный бегун',W/2,200,38,'#fff');T('⭐ лови  ·  🟥 уворачивайся',W/2,255,18,'#cfd6ff');
   T('Комбо даёт множитель очков,',W/2,300,15,'#8f98d8');T('бонусы: ❤️ жизнь  🛡️ щит  🧲 магнит  🐌 замедление',W/2,324,15,'#8f98d8');
   T('Стрелки / A D / палец  ·  P — пауза  ·  M — звук',W/2,360,14,'#8f98d8');
   T('Нажми, чтобы начать',W/2,430,24,'#ffd23f');if(hi)T('Рекорд: '+hi,W/2,470,16,'#cfd6ff')}
  else if(st==='over'){T('Игра окончена',W/2,230,38,'#fff');T('Счёт: '+score,W/2,285,26,'#ffd23f');T(newRec?'🎉 Новый рекорд!':'Рекорд: '+hi,W/2,325,18,'#cfd6ff');T('Нажми, чтобы сыграть снова',W/2,400,22,'#fff')}
  else{T('Пауза',W/2,300,38,'#fff');T('Нажми, чтобы продолжить',W/2,350,20,'#cfd6ff')}
 }
}
function go(){if(st==='pause'){st='play';return}if(st==='over'&&performance.now()-dieAt<600)return;if(st!=='play'){reset();st='play'}}
function pause(){if(st==='play')st='pause';else if(st==='pause')st='play'}
addEventListener('keydown',e=>{const k=e.key.toLowerCase();keys[k]=1;
 if(['arrowleft','arrowright',' '].includes(k))e.preventDefault();
 if(k===' '||k==='enter')go();else if(k==='p'||k==='escape')pause();else if(k==='m')muted=!muted});
addEventListener('keyup',e=>keys[e.key.toLowerCase()]=0);
addEventListener('blur',()=>{if(st==='play')st='pause'});
function pt(e){const r=cv.getBoundingClientRect();return{x:(e.clientX-r.left)*W/r.width,y:(e.clientY-r.top)*H/r.height}}
cv.addEventListener('pointerdown',e=>{const q=pt(e);for(const b of btns)if(q.x>=b.x&&q.x<=b.x+b.w&&q.y>=b.y&&q.y<=b.y+b.h){b.fn();return}if(st==='play')tx=q.x});
cv.addEventListener('pointermove',e=>{if(e.buttons||e.pointerType==='touch')tx=pt(e).x});
for(const ev of['pointerup','pointercancel','pointerleave'])cv.addEventListener(ev,()=>tx=null);

let sk=0,th=0,unl=[],btns=[];
try{sk=+localStorage.getItem('sk')||0;th=+localStorage.getItem('th')||0}catch(e){}
const SKINS=[{n:'Синий',a:'#a9b6ff',b:'#4f6bff',u:0},{n:'Огонёк',a:'#ffd27a',b:'#ff5a1f',u:30},{n:'Слайм',a:'#c8ffb0',b:'#2fbf5b',u:60},{n:'Космонавт',a:'#ffffff',b:'#9aa4c4',u:100},{n:'Кошка',a:'#ffc2e6',b:'#e84393',u:150},{n:'Король',a:'#fff3b0',b:'#e0a800',u:250}];
const THEMES=[{n:'Космос',t:'#0b0d1f',b:'#232866',u:0},{n:'Закат',t:'#2b1055',b:'#ff6a3d',u:40},{n:'Неон',t:'#050014',b:'#0a3d62',u:120},{n:'Лес',t:'#06231a',b:'#1f6f4a',u:200}];
sk=Math.min(sk,SKINS.length-1);th=Math.min(th,THEMES.length-1);
function cyc(w,d){if(w)th=(th+d+THEMES.length)%THEMES.length;else sk=(sk+d+SKINS.length)%SKINS.length;try{localStorage.setItem('sk',sk);localStorage.setItem('th',th)}catch(e){}snd(500,.06)}
const okSel=()=>SKINS[sk].u<=hi&&THEMES[th].u<=hi;
function over(){st='over';dieAt=performance.now();newRec=score>hi;unl=[];const o=hi;if(newRec){hi=score;try{localStorage.setItem('hi',hi)}catch(e){}}for(const x of SKINS.concat(THEMES))if(x.u>o&&x.u<=hi)unl.push(x.n)}
function go(){if(st==='pause'){st='play';return}if(st==='over'&&performance.now()-dieAt<600)return;if(st!=='play'){if(!okSel())return;reset();st='play'}}
function toMenu(){reset();st='menu'}
function panel(x,y,w,h){g.fillStyle='rgba(10,14,40,.72)';g.beginPath();g.roundRect(x,y,w,h,16);g.fill();g.strokeStyle='rgba(255,255,255,.18)';g.lineWidth=2;g.stroke()}
function btn(x,y,w,h,label,fn,c1='#3c56e0',c2='#7b90ff',sz=22,dis){
 btns.push({x,y,w,h,fn});
 const q=g.createLinearGradient(0,y,0,y+h);q.addColorStop(0,dis?'#5a5f7e':c2);q.addColorStop(1,dis?'#3a3e58':c1);
 g.fillStyle=q;g.beginPath();g.roundRect(x,y,w,h,h/3);g.fill();g.strokeStyle='rgba(255,255,255,.4)';g.lineWidth=2;g.stroke();
 T(label,x+w/2,y+h/2+sz*.35,sz,'#fff');
}
function dm(r){g.beginPath();g.moveTo(0,-r);g.lineTo(r*.8,0);g.lineTo(0,r);g.lineTo(-r*.8,0);g.closePath();g.fill()}
function lin(y0,y1,a,b){const q=g.createLinearGradient(0,y0,0,y1);q.addColorStop(0,a);q.addColorStop(1,b);return q}
function drawItem(o){
 g.save();g.translate(o.x,o.y);const s=o.s,k=o.k;
 if(k==='block'){g.rotate(Math.sin(t*.05+o.x)*.3);g.fillStyle=lin(-s,s,'#ff6b6f','#a82a30');g.beginPath();g.roundRect(-s,-s,s*2,s*2,4);g.fill();g.strokeStyle='#6e1a1f';g.lineWidth=2;g.stroke();
  g.beginPath();g.moveTo(-s+3,-s+3);g.lineTo(s-3,s-3);g.moveTo(s-3,-s+3);g.lineTo(-s+3,s-3);g.strokeStyle='rgba(0,0,0,.25)';g.stroke();
  g.fillStyle='#ffd0d2';for(const[a,b]of[[-1,-1],[1,-1],[-1,1],[1,1]]){g.beginPath();g.arc(a*(s-5),b*(s-5),1.8,0,7);g.fill()}}
 else if(k==='zig'){g.rotate(t*.1);g.fillStyle=lin(-s,s,'#ffd166','#e8590c');dm(s);g.fillStyle='rgba(255,255,255,.35)';dm(s*.5)}
 else if(k==='spike'){g.fillStyle=lin(-s,s*1.4,'#ff8fc4','#c2185b');g.beginPath();g.moveTo(-s,-s);g.lineTo(s,-s);g.lineTo(0,s*1.4);g.fill();g.fillStyle='rgba(255,255,255,.35)';g.beginPath();g.moveTo(-s+3,-s+2);g.lineTo(-2,-s+2);g.lineTo(-3,2);g.fill()}
 else if(k==='star'){g.shadowBlur=14;g.shadowColor='#ffd23f';g.rotate(t*.04);g.fillStyle=lin(-s,s,'#fff6b0','#ff9f1c');starPath(s*1.2);g.shadowBlur=0;g.fillStyle='rgba(255,255,255,.55)';starPath(s*.5)}
 else if(k==='gem'){g.shadowBlur=14;g.shadowColor='#5ad1ff';g.rotate(Math.sin(t*.05)*.2);g.fillStyle=lin(-s,s,'#b8ecff','#1b7fd1');dm(s);g.shadowBlur=0;g.fillStyle='rgba(255,255,255,.45)';g.beginPath();g.moveTo(0,-s);g.lineTo(s*.8,0);g.lineTo(-s*.8,0);g.fill()}
 else{const c={heart:'#ff6b8b',shield:'#5ad1ff',magnet:'#c28bff',slow:'#7dff9b'}[k];g.shadowBlur=14;g.shadowColor=c;g.fillStyle='rgba(255,255,255,.15)';g.beginPath();g.arc(0,0,s+4,0,7);g.fill();g.strokeStyle=c;g.lineWidth=3;g.stroke();g.shadowBlur=0;g.font='22px serif';g.textAlign='center';g.textBaseline='middle';g.fillText(EM[k],0,2)}
 g.restore();
}
function drawPlayer(px,py,r,i){
 const s=SKINS[i],tt=performance.now()/16;g.save();g.translate(px,py);
 if(i===2)g.scale(1+Math.sin(tt*.15)*.08,1-Math.sin(tt*.15)*.08);
 if(i===1){g.fillStyle='#ffb300';g.beginPath();g.moveTo(-r*.5,-r*.6);g.lineTo(0,-r*(1.5+Math.sin(tt*.4)*.2));g.lineTo(r*.5,-r*.6);g.fill()}
 if(i===4){g.fillStyle=s.b;for(const d of[-1,1]){g.beginPath();g.moveTo(d*r*.9,-r*.2);g.lineTo(d*r*.5,-r*1.35);g.lineTo(d*r*.1,-r*.8);g.fill()}}
 const q=g.createRadialGradient(-r*.3,-r*.3,r*.1,0,0,r);q.addColorStop(0,s.a);q.addColorStop(1,s.b);
 g.fillStyle=q;g.shadowBlur=16;g.shadowColor=s.b;g.beginPath();g.arc(0,0,r,0,7);g.fill();g.shadowBlur=0;
 if(i===3){g.fillStyle='rgba(20,30,70,.85)';g.beginPath();g.ellipse(0,-r*.1,r*.7,r*.5,0,0,7);g.fill();g.fillStyle='rgba(255,255,255,.45)';g.beginPath();g.ellipse(-r*.25,-r*.3,r*.2,r*.1,0,0,7);g.fill()}
 else{g.fillStyle='#fff';g.beginPath();g.arc(-r*.37,-r*.18,r*.28,0,7);g.arc(r*.37,-r*.18,r*.28,0,7);g.fill();g.fillStyle='#14163a';g.beginPath();g.arc(-r*.37,-r*.18,r*.12,0,7);g.arc(r*.37,-r*.18,r*.12,0,7);g.fill();g.strokeStyle='#14163a';g.lineWidth=2;g.beginPath();g.arc(0,r*.2,r*.3,.2,Math.PI-.2);g.stroke()}
 if(i===5){g.fillStyle='#ffd23f';g.beginPath();g.moveTo(-r*.6,-r*.85);g.lineTo(-r*.6,-r*1.5);g.lineTo(-r*.3,-r*1.15);g.lineTo(0,-r*1.6);g.lineTo(r*.3,-r*1.15);g.lineTo(r*.6,-r*1.5);g.lineTo(r*.6,-r*.85);g.fill()}
 g.restore();
}
function sel(y,label,txt,lock,w){btn(50,y,46,44,'◀',()=>cyc(w,-1),'#2a3380','#5266d9',18);btn(W-96,y,46,44,'▶',()=>cyc(w,1),'#2a3380','#5266d9',18);
 T(label,W/2,y+16,13,'#8f98d8');T(txt,W/2,y+38,20,lock?'#ff9aa2':'#fff')}
function ib(x,y,e,fn){btns.push({x,y,w:36,h:36,fn});panel(x,y,36,36);T(e,x+18,y+26,18,'#fff')}
function draw(){
 btns=[];const T_=THEMES[th];
 const gr=g.createLinearGradient(0,0,0,H);gr.addColorStop(0,T_.t);gr.addColorStop(1,T_.b);g.fillStyle=gr;g.fillRect(0,0,W,H);
